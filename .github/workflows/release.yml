name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++-14

      - name: Configure CMake
        run: cmake --preset release ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14' || '' }}

      - name: Build
        run: cmake --build --preset release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp build/release/Turret_2.exe dist/
            cp libs/MSVC_dll/*.dll dist/
          else
            cp build/release/Turret_2 dist/
            cp libs/GCC_so/*.so* dist/
          fi
          cp -r libs/licenses dist/
          cp -r res dist/

          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a ../Turret_2_win.zip .
          else
            tar -czf ../Turret_2_linux.tar.gz .
          fi

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: Turret_2_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
